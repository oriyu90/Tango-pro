name: eSpeak NG unsigned Android release

on:
  workflow_dispatch:
    inputs:
      accept_android_sdk_terms:
        description: "Set true only after an authorized person accepts the Android SDK terms and configures the protected license-record secret"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: espeak-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  terms-gate:
    runs-on: ubuntu-24.04
    steps:
      - name: Require explicit Android SDK terms acceptance
        env:
          ACCEPTANCE: ${{ inputs.accept_android_sdk_terms }}
        run: |
          if [ "$ACCEPTANCE" != "true" ]; then
            echo "Android SDK terms have not been explicitly accepted for this CI run."
            echo "Re-run manually with accept_android_sdk_terms=true only after an authorized person accepts the terms."
            exit 1
          fi

  build-unsigned-release:
    needs: terms-gate
    runs-on: ubuntu-24.04
    environment: espeak-production-build
    timeout-minutes: 60
    env:
      ESPEAK_REPOSITORY: https://github.com/espeak-ng/espeak-ng.git
      ESPEAK_COMMIT: 7d426728fe146f4168fa716e29d8e276c7da33f2
      ESPEAK_WORKDIR: ${{ runner.temp }}/espeak-ng
      GRADLE_USER_HOME: ${{ runner.temp }}/gradle-home
      ANDROID_SDK_LICENSES_TAR_GZ_B64: ${{ secrets.ANDROID_SDK_LICENSES_TAR_GZ_B64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17.0.12+7"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: Install locked Android build dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_SDK_LICENSES_TAR_GZ_B64" ]; then
            echo "Missing protected ANDROID_SDK_LICENSES_TAR_GZ_B64 secret containing manually accepted SDK license records."
            exit 1
          fi
          mkdir -p "$ANDROID_HOME/licenses"
          printf '%s' "$ANDROID_SDK_LICENSES_TAR_GZ_B64" | base64 --decode | tar -xzf - -C "$ANDROID_HOME"
          test -n "$(find "$ANDROID_HOME/licenses" -type f -print -quit)"
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;29.0.14206865" \
            "cmake;3.22.1"
      - name: Verify build lock and clone pinned upstream source
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r '.upstream.commit' windows/runtime/espeak-android-build.lock.json)" = "$ESPEAK_COMMIT"
          test "$(jq -r '.upstream.repository' windows/runtime/espeak-android-build.lock.json)" = "$ESPEAK_REPOSITORY"
          git clone --filter=blob:none "$ESPEAK_REPOSITORY" "$ESPEAK_WORKDIR"
          git -C "$ESPEAK_WORKDIR" checkout --detach "$ESPEAK_COMMIT"
          test "$(git -C "$ESPEAK_WORKDIR" rev-parse HEAD)" = "$ESPEAK_COMMIT"
          test -z "$(git -C "$ESPEAK_WORKDIR" status --porcelain)"
      - name: Verify the pinned upstream Android inputs
        shell: bash
        run: |
          set -euo pipefail
          lock='windows/runtime/espeak-android-build.lock.json'
          test "$(jq -r '.toolchain.androidGradlePlugin' "$lock")" = '9.3.0'
          test "$(jq -r '.toolchain.androidSdkPackages.ndk' "$lock")" = 'ndk;29.0.14206865'
          test "$(jq -r '.toolchain.androidSdkPackages.cmake' "$lock")" = 'cmake;3.22.1'
          test "$(jq -r '.androidProject.compileSdk' "$lock")" = '34'
          test "$(jq -r '.androidProject.targetSdk' "$lock")" = '33'
          test "$(jq -r '.androidProject.versionName' "$lock")" = '1.53.0'
          test "$(jq -r '.androidProject.versionCode' "$lock")" = '23'
          mkdir -p "$ESPEAK_WORKDIR/out"
          grep -F "classpath 'com.android.tools.build:gradle:9.3.0'" "$ESPEAK_WORKDIR/android/build.gradle"
          grep -F 'ndkVersion = "29.0.14206865"' "$ESPEAK_WORKDIR/android/build.gradle"
          grep -F 'version = "3.22.1"' "$ESPEAK_WORKDIR/android/build.gradle"
          grep -F 'compileSdk = 34' "$ESPEAK_WORKDIR/android/build.gradle"
          grep -F 'targetSdk = 33' "$ESPEAK_WORKDIR/android/build.gradle"
          grep -F 'versionCode = 23' "$ESPEAK_WORKDIR/android/build.gradle"
          grep -F 'versionName = "1.53.0"' "$ESPEAK_WORKDIR/android/build.gradle"
          grep -F 'distributionUrl=https\\://services.gradle.org/distributions/gradle-9.6.1-bin.zip' "$ESPEAK_WORKDIR/android/gradle/wrapper/gradle-wrapper.properties"
          {
            echo "sourceCommit=$(git -C "$ESPEAK_WORKDIR" rev-parse HEAD)"
            java -version 2>&1
            sdkmanager --version
            "$ANDROID_HOME/ndk/29.0.14206865/ndk-build" --version
            "$ANDROID_HOME/cmake/3.22.1/bin/cmake" --version
          } > "$ESPEAK_WORKDIR/out/toolchain-versions.txt"
      - name: Build twice and compare unsigned APK hashes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ESPEAK_WORKDIR/logs" "$ESPEAK_WORKDIR/out"
          export SOURCE_DATE_EPOCH="$(git -C "$ESPEAK_WORKDIR" show -s --format=%ct HEAD)"
          build_once() {
            local sequence="$1"
            (
              cd "$ESPEAK_WORKDIR/android"
              ./gradlew --no-daemon --stacktrace --console=plain assembleRelease
            ) 2>&1 | tee "$ESPEAK_WORKDIR/logs/assemble-release-${sequence}.log"
            cp "$ESPEAK_WORKDIR/android/build/outputs/apk/release/espeak-release-unsigned.apk" \
              "$ESPEAK_WORKDIR/out/espeak-release-unsigned-${sequence}.apk"
          }
          build_once 1
          git -C "$ESPEAK_WORKDIR" clean -ffdX android
          rm -rf "$GRADLE_USER_HOME/caches" "$GRADLE_USER_HOME/daemon"
          build_once 2
          sha256sum "$ESPEAK_WORKDIR/out"/*.apk | tee "$ESPEAK_WORKDIR/out/SHA256SUMS"
          hash_1="$(sha256sum "$ESPEAK_WORKDIR/out/espeak-release-unsigned-1.apk" | awk '{print $1}')"
          hash_2="$(sha256sum "$ESPEAK_WORKDIR/out/espeak-release-unsigned-2.apk" | awk '{print $1}')"
          if [ "$hash_1" != "$hash_2" ]; then
            mkdir -p "$ESPEAK_WORKDIR/out/unpacked-1" "$ESPEAK_WORKDIR/out/unpacked-2"
            unzip -q "$ESPEAK_WORKDIR/out/espeak-release-unsigned-1.apk" -d "$ESPEAK_WORKDIR/out/unpacked-1"
            unzip -q "$ESPEAK_WORKDIR/out/espeak-release-unsigned-2.apk" -d "$ESPEAK_WORKDIR/out/unpacked-2"
            {
              echo "unsigned APK hashes differ: $hash_1 != $hash_2"
              echo "Classification candidates: classes.dex resources.arsc AndroidManifest.xml native .so espeakdata.zip ZIP metadata"
              for entry in classes.dex resources.arsc AndroidManifest.xml lib/x86_64/libttsespeak.so res/raw/espeakdata.zip res/raw/espeakdata_version; do
                printf '%s\n' "[$entry]"
                sha256sum "$ESPEAK_WORKDIR/out/unpacked-1/$entry" "$ESPEAK_WORKDIR/out/unpacked-2/$entry" 2>&1 || true
              done
              echo '[ZIP metadata build 1]'
              zipinfo -v "$ESPEAK_WORKDIR/out/espeak-release-unsigned-1.apk"
              echo '[ZIP metadata build 2]'
              zipinfo -v "$ESPEAK_WORKDIR/out/espeak-release-unsigned-2.apk"
            } > "$ESPEAK_WORKDIR/logs/reproducibility-diff.txt"
            exit 1
          fi
      - name: Inspect the reproducible unsigned APK
        shell: bash
        run: |
          set -euo pipefail
          apk="$ESPEAK_WORKDIR/out/espeak-release-unsigned-1.apk"
          aapt="$ANDROID_HOME/build-tools/34.0.0/aapt"
          "$aapt" dump badging "$apk" | tee "$ESPEAK_WORKDIR/out/aapt-badging.txt"
          "$aapt" dump badging "$apk" | grep -F "package: name='com.reecedunn.espeak' versionCode='23' versionName='1.53.0'"
          "$aapt" dump badging "$apk" | grep -F "sdkVersion:'21'"
          "$aapt" dump badging "$apk" | grep -F "targetSdkVersion:'33'"
          "$aapt" dump badging "$apk" | grep -E "native-code:.*x86_64"
          unzip -Z1 "$apk" | sort | tee "$ESPEAK_WORKDIR/out/apk-file-list.txt"
          grep -Fx 'lib/x86_64/libttsespeak.so' "$ESPEAK_WORKDIR/out/apk-file-list.txt"
          grep -Fx 'res/raw/espeakdata.zip' "$ESPEAK_WORKDIR/out/apk-file-list.txt"
          grep -Fx 'res/raw/espeakdata_version' "$ESPEAK_WORKDIR/out/apk-file-list.txt"
          jq -n \
            --arg sourceCommit "$ESPEAK_COMMIT" \
            --arg unsignedSha256 "$(sha256sum "$apk" | awk '{print $1}')" \
            --arg buildDateUtc "$(date --utc +%Y-%m-%dT%H:%M:%SZ)" \
            '{sourceCommit: $sourceCommit, versionName: "1.53.0", versionCode: 23, packageName: "com.reecedunn.espeak", minSdk: 21, targetSdk: 33, abi: ["x86_64"], unsignedSha256: $unsignedSha256, buildDateUtc: $buildDateUtc, signing: "unsigned"}' \
            > "$ESPEAK_WORKDIR/out/espeak-unsigned-metadata.json"
      - name: Collect native espeak-data failure context
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p "$ESPEAK_WORKDIR/logs"
          {
            echo "Expected native tasks and outputs:"
            echo "externalNativeBuildRelease"
            echo "espeak-data"
            echo "build/generated/espeak-ng-data"
            echo "res/raw/espeakdata.zip"
            echo "res/raw/espeakdata_version"
            echo
            echo "Existing matching files:"
            find "$ESPEAK_WORKDIR/android" \
              \( -path '*/build/generated/espeak-ng-data*' -o -path '*/build/intermediates/cxx*' -o -name espeakdata.zip -o -name espeakdata_version \) \
              -print 2>/dev/null || true
            echo
            echo "Matching Gradle log lines:"
            grep -hE 'externalNativeBuildRelease|espeak-data|espeakdata\.zip|espeakdata_version' \
              "$ESPEAK_WORKDIR"/logs/*.log 2>/dev/null || true
          } > "$ESPEAK_WORKDIR/logs/native-espeak-data-diagnostics.txt"
      - name: Upload logs and native espeak-data diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: espeak-ng-linux-build-diagnostics
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/espeak-ng/logs/**
            ${{ runner.temp }}/espeak-ng/android/build/generated/espeak-ng-data/**
            ${{ runner.temp }}/espeak-ng/android/build/intermediates/cxx/**
            ${{ runner.temp }}/espeak-ng/android/res/raw/espeakdata.zip
            ${{ runner.temp }}/espeak-ng/android/res/raw/espeakdata_version
            ${{ runner.temp }}/espeak-ng/out/toolchain-versions.txt
            ${{ runner.temp }}/espeak-ng/logs/reproducibility-diff.txt
      - name: Upload reproducible unsigned candidate
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: espeak-ng-unsigned-release-candidate
          path: |
            ${{ runner.temp }}/espeak-ng/out/espeak-release-unsigned-1.apk
            ${{ runner.temp }}/espeak-ng/out/espeak-release-unsigned-2.apk
            ${{ runner.temp }}/espeak-ng/out/SHA256SUMS
            ${{ runner.temp }}/espeak-ng/out/aapt-badging.txt
            ${{ runner.temp }}/espeak-ng/out/apk-file-list.txt
            ${{ runner.temp }}/espeak-ng/out/espeak-unsigned-metadata.json
            ${{ runner.temp }}/espeak-ng/out/toolchain-versions.txt
