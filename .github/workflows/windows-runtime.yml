name: Windows runtime build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guardrails:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require an audited runtime manifest
        shell: pwsh
        run: |
          $components = Get-Content windows/runtime/components.lock.json -Raw | ConvertFrom-Json
          if ($components.runtimeModel -ne 'official-sdk-first-run' -or $null -eq $components.androidSdk -or $components.androidSdk.downloadedDirectlyByUser -ne $true) {
            throw 'The production runtime must use the official user-acquired SDK model.'
          }
          if ($components.androidSdk.distribution -ne $false) {
            throw 'Google Android SDK components must not be distributed by Tango Pro.'
          }
          $bootstrap = Get-Content windows/runtime/sdk-bootstrap.lock.json -Raw | ConvertFrom-Json
          if ($bootstrap.commandLineTools.downloadedDirectlyByUser -ne $true -or -not $bootstrap.commandLineTools.sha256) {
            throw 'The SDK bootstrap lock is incomplete.'
          }
          if ($components.status -ne 'approved') {
            throw 'Runtime technical and license gates are not approved.'
          }
          if ((Get-Content windows/runtime/licenses/SOURCE_COMPONENTS.json -Raw | ConvertFrom-Json).status -ne 'approved') {
            throw 'License audit is not approved.'
          }
