name: Windows runtime CI

on:
  pull_request:
    paths: ["windows/**", "app/**", ".github/workflows/windows-ci.yml"]
  push:
    branches: [main]
    paths: ["windows/**", "app/**", ".github/workflows/windows-ci.yml"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e97e019869537ab6d7ac5d4a69e8ec7d6985df5e # 1.98.0
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: Rust format, lint, and tests
        working-directory: windows/launcher
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
      - name: PowerShell syntax validation
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem windows/scripts -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors)
            $errors += $parseErrors
          }
          if ($errors.Count) { $errors | Format-List | Out-String | Write-Error; exit 1 }
      - name: Validate runtime metadata JSON
        shell: pwsh
        run: |
          Get-Content windows/runtime/runtime.lock.json -Raw | ConvertFrom-Json | Out-Null
          Get-Content windows/runtime/components.lock.json -Raw | ConvertFrom-Json | Out-Null
          Get-Content windows/runtime/app.lock.json -Raw | ConvertFrom-Json | Out-Null
