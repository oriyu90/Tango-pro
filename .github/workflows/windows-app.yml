name: Windows app payload

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-payload:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: Install Android platform
        run: sdkmanager "platforms;android-36.1" "build-tools;36.1.0"
      - name: Build and inspect Android payload
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\windows\scripts\build-app.ps1 -SdkRoot $env:ANDROID_HOME
      - name: Upload unsigned development payload for runtime smoke testing
        uses: actions/upload-artifact@v4
        with:
          name: tango-pro-android-debug-payload
          path: |
            dist-android/Tango-pro-2.1.0-android-debug.apk
            windows/runtime/app.lock.json
