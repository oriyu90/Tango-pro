[package]
name = "tango-pro-launcher"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "LicenseRef-Proprietary"
description = "Windows supervisor for the existing Tango Pro Android APK"

[[bin]]
name = "TangoPro"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Threading",
  "Win32_Storage_FileSystem",
] }
